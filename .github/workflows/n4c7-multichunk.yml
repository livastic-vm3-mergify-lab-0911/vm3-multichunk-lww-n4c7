name: VM3 N4C7 real multichunk

on:
  workflow_dispatch:
    inputs:
      order:
        description: Failure placement
        required: true
        type: choice
        options:
          - fail-first
          - fail-last

permissions:
  contents: read

jobs:
  old-client:
    name: n4c7-old-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate deterministic oversized JUnit
        env:
          ORDER: ${{ inputs.order }}
        run: |
          python3 - <<'PY'
          import base64, os, random
          from pathlib import Path
          order=os.environ['ORDER']
          n=400
          payload=70000
          fail_pos=0 if order=='fail-first' else n-1
          marker='REALFAILFIRST' if order=='fail-first' else 'REALFAILLAST'
          rnd=random.Random(0x4E344337 + fail_pos)
          out=['<?xml version="1.0" encoding="UTF-8"?>','<testsuites>',f'<testsuite name="n4c7" tests="{n}" failures="1">']
          for i in range(n):
              blob=base64.b64encode(rnd.randbytes(payload)).decode()
              name=f'N4C7.{marker}.case.{i:03d}'
              if i==fail_pos:
                  out.append(f'<testcase classname="vm3" name="{name}" file="{blob}" time="0.001"><failure message="deterministic failure">N4C7_{marker}_FAILURE</failure></testcase>')
              else:
                  out.append(f'<testcase classname="vm3" name="{name}" file="{blob}" time="0.001"/>')
          out += ['</testsuite>','</testsuites>']
          Path('report.xml').write_text('\n'.join(out)+'\n')
          print(f'generated_order={order} bytes={Path("report.xml").stat().st_size}')
          PY
      - name: Record deterministic test failure
        id: tests
        continue-on-error: true
        run: exit 1
      - name: First-party Mergify JUnit upload
        id: mergify
        continue-on-error: true
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: report.xml
          test_step_outcome: ${{ steps.tests.outcome }}
          job_name: n4c7-old-cli
      - name: Evidence
        if: always()
        run: |
          mergify --version || true
          echo "test_outcome=${{ steps.tests.outcome }}"
          echo "mergify_outcome=${{ steps.mergify.outcome }}"
          echo "upload=${{ steps.mergify.outputs.test_results_upload }}"
